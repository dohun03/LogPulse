version: '3.9'

# Kafka 공용 ENV 설정
x-kafka-common-env: &kafka-common-env
  KAFKA_CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
  KAFKA_PROCESS_ROLES: 'broker,controller' # KRaft 모드로 스스로 관리(Controller)
  KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
  KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093'
  KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false' # 토픽 수동 설정
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3      # 브로커 3 곳에 복제
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_MIN_INSYNC_REPLICAS: 2 # Ack가 성공하기 위해 살아있어야 하는 최소 복제본 개수
  KAFKA_HEAP_OPTS: '-Xmx512m -Xms512m'
  KAFKA_LOG_DIRS: /var/lib/kafka/data # 실제 로그 저장 경로

# API 서버 공용 설정
x-api-common: &api-common
  build:
    context: ..
    dockerfile: apps/api-server/Dockerfile
  restart: unless-stopped
  environment:
    PORT: '3000'
    KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    KAFKA_CLICK_TOPIC: click-events
    KAFKA_PAYMENT_TOPIC: payment-events
    API_KEY: dev-api-key
    RATE_LIMIT_MAX: '5000'
    API_INSTANCE_COUNT: '2'
    LOG_LEVEL: info
  depends_on: # Kafka 3대 전부 실행되면 서버 가동
    kafka-1:
      condition: service_healthy
    kafka-2:
      condition: service_healthy
    kafka-3:
      condition: service_healthy
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://localhost:3000/health/liveness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
    interval: 10s
    timeout: 5s
    retries: 10
  networks:
    - logpulse_net

# Worker 공용 ENV 설정
x-worker-env: &worker-env
  KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
  KAFKA_CLICK_TOPIC: click-events
  KAFKA_PAYMENT_TOPIC: payment-events
  KAFKA_PAYMENT_DLQ_TOPIC: payment-events-dlq
  REDIS_URL: redis://redis:6379
  REDIS_CLICK_DEDUP_TTL_SEC: '600'
  REDIS_PAYMENT_DEDUP_TTL_SEC: '86400'
  CLICK_BATCH_MAX_SIZE: '500'  # 클릭 토픽: 500개 쌓이거나, 1초 간격으로 DB 저장
  CLICK_BATCH_FLUSH_MS: '1000'
  PAYMENT_MAX_RETRY: '3'       # 결제 토픽: 최대 3번 재시도 후, 실패하면 DLQ 토픽으로.
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_DATABASE: logpulse
  CLICKHOUSE_USERNAME: logpulse_writer
  CLICKHOUSE_PASSWORD: logpulse-writer-dev
  METRICS_PORT: '9100'
  LOG_LEVEL: info

# Worker 공용 설정
x-worker-common: &worker-common
  build:
    context: ..
    dockerfile: apps/consumer-worker/Dockerfile
  restart: unless-stopped
  environment:
    <<: *worker-env
  depends_on: # Kafka 3대, Redis, ClickHouse 전부 실행되면 서버 가동
    kafka-1:
      condition: service_healthy
    kafka-2:
      condition: service_healthy
    kafka-3:
      condition: service_healthy
    redis:
      condition: service_healthy
    clickhouse:
      condition: service_healthy
  networks:
    - logpulse_net

# 실제 실행 컨테이너 설정들
services:
  # 각 Kafka 1,2,3 컨테이너 설정
  kafka-1:
    image: apache/kafka:4.3.1
    container_name: logpulse-kafka-1
    hostname: kafka-1
    restart: unless-stopped
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 1
      # PLAINTEXT: 도커 내부 포트 (API 서버, Worker와 통신 / 전부 9092)
      # CONTROLLER: KRaft모드 관리용 포트 (kafka끼리 서로 상태 공유 / 전부 9093)
      # PLAINTEXT_HOST: 외부 접근용 포트 (로컬, 부하 테스트 / 서로 다름, 각각: 19092, 29092, 39092)
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:19092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-1:9092,PLAINTEXT_HOST://localhost:19092'
    ports:
      - '19092:19092'
    volumes:
      - kafka_1_data:/var/lib/kafka/data
      - ./kafka/create-topics.sh:/infra/kafka/create-topics.sh:ro
    healthcheck:
      test:
        - CMD
        - /opt/kafka/bin/kafka-broker-api-versions.sh
        - --bootstrap-server
        - localhost:9092
      interval: 15s
      timeout: 10s
      retries: 12
    networks:
      - logpulse_net

  kafka-2:
    image: apache/kafka:4.3.1
    container_name: logpulse-kafka-2
    hostname: kafka-2
    restart: unless-stopped
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-2:9092,PLAINTEXT_HOST://localhost:29092'
    ports:
      - '29092:29092'
    volumes:
      - kafka_2_data:/var/lib/kafka/data
      - ./kafka/create-topics.sh:/infra/kafka/create-topics.sh:ro
    healthcheck:
      test:
        - CMD
        - /opt/kafka/bin/kafka-broker-api-versions.sh
        - --bootstrap-server
        - localhost:9092
      interval: 15s
      timeout: 10s
      retries: 12
    networks:
      - logpulse_net

  kafka-3:
    image: apache/kafka:4.3.1
    container_name: logpulse-kafka-3
    hostname: kafka-3
    restart: unless-stopped
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:39092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-3:9092,PLAINTEXT_HOST://localhost:39092'
    ports:
      - '39092:39092'
    volumes:
      - kafka_3_data:/var/lib/kafka/data
      - ./kafka/create-topics.sh:/infra/kafka/create-topics.sh:ro
    healthcheck:
      test:
        - CMD
        - /opt/kafka/bin/kafka-broker-api-versions.sh
        - --bootstrap-server
        - localhost:9092
      interval: 15s
      timeout: 10s
      retries: 12
    networks:
      - logpulse_net

  # Redis 컨테이너 설정
  redis:
    image: redis:7-alpine
    container_name: logpulse-redis
    restart: unless-stopped
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning'] # 60초 간격 디스크 백업
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - logpulse_net

  # ClickHouse 컨테이너 설정
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: logpulse-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: logpulse
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ''
      CLICKHOUSE_WRITER_PASSWORD: 'logpulse-writer-dev'
      CLICKHOUSE_READER_PASSWORD: 'logpulse-reader-dev'
    ports:
      - '8123:8123' # 평소 사용(배치 저장, 조회) 할 포트
      - '9000:9000' # 좀 더 빠른 전용 바이너리 포트
    volumes:
      - clickhouse_data:/var/lib/clickhouse                            # 실제 데이터 저장 경로
      - ./clickhouse/init.sql:/infra/clickhouse/init.sql:ro            # 초기 실행 파일: DB 구조 설정
      - ./clickhouse/init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro # 초기 실행 파일: DB 계정 설정
    healthcheck:
      test: ['CMD', 'wget', '--spider', 'http://localhost:8123/ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - logpulse_net

  # 각 API 서버 컨테이너 설정
  api-server-1:
    <<: *api-common
    container_name: logpulse-api-1
    environment:
      PORT: '3000'
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_CLIENT_ID: logpulse-api-server-1
      KAFKA_CLICK_TOPIC: click-events
      KAFKA_PAYMENT_TOPIC: payment-events
      API_KEY: dev-api-key
      RATE_LIMIT_MAX: '5000'
      API_INSTANCE_COUNT: '2'
      LOG_LEVEL: info

  api-server-2:
    <<: *api-common
    container_name: logpulse-api-2
    environment:
      PORT: '3000'
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_CLIENT_ID: logpulse-api-server-2
      KAFKA_CLICK_TOPIC: click-events
      KAFKA_PAYMENT_TOPIC: payment-events
      API_KEY: dev-api-key
      RATE_LIMIT_MAX: '5000'
      API_INSTANCE_COUNT: '2'
      LOG_LEVEL: info

  # Nginx 컨테이너 설정
  nginx:
    image: nginx:1.25-alpine
    container_name: logpulse-nginx
    restart: unless-stopped
    depends_on:
      api-server-1:
        condition: service_started
      api-server-2:
        condition: service_started
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - logpulse_net

  # Worker 컨테이너 설정(click 3개, payment 2개)
  worker-click-1:
    <<: *worker-common
    container_name: logpulse-worker-click-1
    environment:
      <<: *worker-env
      CONSUMER_ROLE: click
      KAFKA_CLIENT_ID: logpulse-worker-click-1
      CLICK_CONSUMER_GROUP_ID: logpulse-click-loader

  worker-click-2:
    <<: *worker-common
    container_name: logpulse-worker-click-2
    environment:
      <<: *worker-env
      CONSUMER_ROLE: click
      KAFKA_CLIENT_ID: logpulse-worker-click-2
      CLICK_CONSUMER_GROUP_ID: logpulse-click-loader

  worker-click-3:
    <<: *worker-common
    container_name: logpulse-worker-click-3
    environment:
      <<: *worker-env
      CONSUMER_ROLE: click
      KAFKA_CLIENT_ID: logpulse-worker-click-3
      CLICK_CONSUMER_GROUP_ID: logpulse-click-loader

  worker-payment-1:
    <<: *worker-common
    container_name: logpulse-worker-payment-1
    environment:
      <<: *worker-env
      CONSUMER_ROLE: payment
      KAFKA_CLIENT_ID: logpulse-worker-payment-1
      PAYMENT_CONSUMER_GROUP_ID: logpulse-payment-loader

  worker-payment-2:
    <<: *worker-common
    container_name: logpulse-worker-payment-2
    environment:
      <<: *worker-env
      CONSUMER_ROLE: payment
      KAFKA_CLIENT_ID: logpulse-worker-payment-2
      PAYMENT_CONSUMER_GROUP_ID: logpulse-payment-loader

  # Prometheus 컨테이너 설정
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: logpulse-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - logpulse_net

  # Grafana 컨테이너 설정
  grafana:
    image: grafana/grafana:11.1.0
    container_name: logpulse-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - '3001:3000'
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - logpulse_net

# 데이터 영구 저장
volumes:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
  clickhouse_data:
  prometheus_data:
  grafana_data:

# Bridge 모드 네크워크, 컨테이너 간 DNS 통신
networks:
  logpulse_net:
    driver: bridge