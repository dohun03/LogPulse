version: '3.9'

x-kafka-common-env: &kafka-common-env
  KAFKA_CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
  KAFKA_PROCESS_ROLES: 'broker,controller'
  KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
  KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093'
  KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_HEAP_OPTS: '-Xmx512m -Xms512m'
  KAFKA_LOG_DIRS: /var/lib/kafka/data

x-api-placeholder: &api-placeholder
  image: node:20-alpine
  restart: unless-stopped
  working_dir: /app
  networks:
    - logpulse_net

services:
  kafka-1:
    image: apache/kafka:4.3.1
    container_name: logpulse-kafka-1
    hostname: kafka-1
    restart: unless-stopped
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:19092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-1:9092,PLAINTEXT_HOST://localhost:19092'
    ports:
      - '19092:19092'
    volumes:
      - kafka_1_data:/var/lib/kafka/data
      - ./kafka/create-topics.sh:/infra/kafka/create-topics.sh:ro
    healthcheck:
      test:
        - CMD
        - /opt/kafka/bin/kafka-broker-api-versions.sh
        - --bootstrap-server
        - localhost:9092
      interval: 15s
      timeout: 10s
      retries: 12
    networks:
      - logpulse_net

  kafka-2:
    image: apache/kafka:4.3.1
    container_name: logpulse-kafka-2
    hostname: kafka-2
    restart: unless-stopped
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-2:9092,PLAINTEXT_HOST://localhost:29092'
    ports:
      - '29092:29092'
    volumes:
      - kafka_2_data:/var/lib/kafka/data
      - ./kafka/create-topics.sh:/infra/kafka/create-topics.sh:ro
    healthcheck:
      test:
        - CMD
        - /opt/kafka/bin/kafka-broker-api-versions.sh
        - --bootstrap-server
        - localhost:9092
      interval: 15s
      timeout: 10s
      retries: 12
    networks:
      - logpulse_net

  kafka-3:
    image: apache/kafka:4.3.1
    container_name: logpulse-kafka-3
    hostname: kafka-3
    restart: unless-stopped
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:39092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-3:9092,PLAINTEXT_HOST://localhost:39092'
    ports:
      - '39092:39092'
    volumes:
      - kafka_3_data:/var/lib/kafka/data
      - ./kafka/create-topics.sh:/infra/kafka/create-topics.sh:ro
    healthcheck:
      test:
        - CMD
        - /opt/kafka/bin/kafka-broker-api-versions.sh
        - --bootstrap-server
        - localhost:9092
      interval: 15s
      timeout: 10s
      retries: 12
    networks:
      - logpulse_net

  redis:
    image: redis:7-alpine
    container_name: logpulse-redis
    restart: unless-stopped
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - logpulse_net

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: logpulse-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: logpulse
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ''
      CLICKHOUSE_WRITER_PASSWORD: 'logpulse-writer-dev'
      CLICKHOUSE_READER_PASSWORD: 'logpulse-reader-dev'
    ports:
      - '8123:8123'
      - '9000:9000'
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/infra/clickhouse/init.sql:ro
      - ./clickhouse/init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ['CMD', 'wget', '--spider', 'http://localhost:8123/ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - logpulse_net

  api-server-1:
    <<: *api-placeholder
    container_name: logpulse-api-1
    environment:
      SERVICE_NAME: api-server-1
    command:
      - sh
      - -c
      - >-
        node -e "const http=require('http');const service=process.env.SERVICE_NAME;
        const server=http.createServer((req,res)=>{if(req.url.startsWith('/health')){res.writeHead(200,{ 'Content-Type':'application/json'});
        res.end(JSON.stringify({status:'ok',service}));return;}res.writeHead(200,{'Content-Type':'text/plain'});
        res.end(`placeholder ${service}`);}); server.listen(3000,'0.0.0.0');"

  api-server-2:
    <<: *api-placeholder
    container_name: logpulse-api-2
    environment:
      SERVICE_NAME: api-server-2
    command:
      - sh
      - -c
      - >-
        node -e "const http=require('http');const service=process.env.SERVICE_NAME;
        const server=http.createServer((req,res)=>{if(req.url.startsWith('/health')){res.writeHead(200,{ 'Content-Type':'application/json'});
        res.end(JSON.stringify({status:'ok',service}));return;}res.writeHead(200,{'Content-Type':'text/plain'});
        res.end(`placeholder ${service}`);}); server.listen(3000,'0.0.0.0');"

  nginx:
    image: nginx:1.25-alpine
    container_name: logpulse-nginx
    restart: unless-stopped
    depends_on:
      api-server-1:
        condition: service_started
      api-server-2:
        condition: service_started
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - logpulse_net

volumes:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
  clickhouse_data:

networks:
  logpulse_net:
    driver: bridge