worker_processes auto;

events {
    worker_connections 4096;
}

http {
    upstream logpulse_api {
        server api-server-1:3000 max_fails=0 fail_timeout=2s;
        server api-server-2:3000 max_fails=0 fail_timeout=2s;
        keepalive 32; # upstream 커넥션 재사용 (고부하 시 커넥션 고갈 방지)
    }

    server {
        listen 80;

        client_max_body_size 1m;

        location / {
            proxy_pass http://logpulse_api;
            proxy_http_version 1.1;
            proxy_set_header Connection ""; # upstream keep-alive 활성화 (Connection 헤더 초기화)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
            proxy_send_timeout 10s;
            # upstream 장애 시 다른 API 인스턴스로 우회 (순간 폭주/일시 오류 대응)
            proxy_next_upstream error timeout invalid_header http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }
    }
}